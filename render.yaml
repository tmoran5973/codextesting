# Projects and artwork are stored in your separate Supabase project.
services:
  - type: web
    name: coloring-studio
    runtime: node
    plan: free
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEMO_PASSWORD
        generateValue: true
      - key: IMAGE_RESERVATION_USD
        value: '0.50'
      - key: REVIEW_RESERVATION_USD
        value: '0.05'
